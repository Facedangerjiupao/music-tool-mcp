name: Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install package and dev dependencies
        run: pip install ".[dev,cloud]"

      - name: Check installed entry points outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          audio-sonic-media --help
          python -c "import server, media_cli; from pipeline.runtime import default_jobs_root; print(server.__file__); print(default_jobs_root())"

      - name: Run tests
        run: pytest --tb=short -q
